name: Remove merged feature branch
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-merged-branch.yml'
permissions:
  contents: write
jobs:
  delete-merged-branch:
    if: github.repository == 'rkfsociety/MemPulse'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm branch is already merged before deleting it
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 70650f38212765c34b854f7e9964a80ce53d54a3
          TARGET: fix/process-group-overflow-20261102
        shell: bash
        run: |
          set -euo pipefail
          actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$TARGET" --jq '.object.sha')"
          if [ "$actual" != "$EXPECTED_SHA" ]; then
            echo "Branch moved; refusing to delete it." >&2
            exit 1
          fi
          behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$EXPECTED_SHA...main" --jq '.behind_by')"
          if [ "$behind" != "0" ]; then
            echo "Branch is not fully integrated into main; refusing deletion." >&2
            exit 1
          fi
          gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TARGET"
          echo "Deleted merged branch $TARGET"
