name: Release MemPulse

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (example: v0.1.0)'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

concurrency:
  group: mempulse-release-GH(github.ref)
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version and commit
        shell: pwsh
        env:
          INPUT_VERSION: GH(inputs.version)
          EVENT_NAME: GH(github.event_name)
        run: |
          $tag = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:GITHUB_REF_NAME }
          if ($tag -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw "Expected a stable semantic version like v0.1.0: $tag"
          }
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commit must be on main.' }
          "TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$($tag.Substring(1))" >> $env:GITHUB_ENV
      - name: Build
        shell: pwsh
        run: dotnet build src/MemPulse/MemPulse.csproj --configuration Release --warnaserror -p:Version=$env:APP_VERSION
      - name: Smoke tests
        shell: pwsh
        run: dotnet run --project tests/MemPulse.SmokeTests/MemPulse.SmokeTests.csproj --configuration Release
      - name: Publish self-contained executable
        shell: pwsh
        run: |
          dotnet publish src/MemPulse/MemPulse.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
      - name: Build per-user installer
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:APP_VERSION
      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          $paths = @('publish/MemPulse.exe', 'dist/MemPulse-Setup-x64.exe')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub Release with installer and portable app
        shell: pwsh
        env:
          GH_TOKEN: GH(github.token)
        run: |
          $existing = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json tagName 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release $env:TAG already exists. Refusing overwrite." }
          gh release create $env:TAG `
            "dist/MemPulse-Setup-x64.exe" `
            "publish/MemPulse.exe" `
            "dist/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MemPulse $env:APP_VERSION" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
