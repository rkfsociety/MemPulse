name: Release MemPulse

# Release automatically when the version in src/Directory.Build.props is raised on main.
on:
  push:
    branches: [main]
    paths:
      - 'src/Directory.Build.props'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mempulse-publish
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        shell: pwsh
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-ProjectVersion([string]$text, [string]$source) {
            if ([string]::IsNullOrWhiteSpace($text)) {
              throw "Project file is empty: $source"
            }
            $match = [regex]::Match($text, '<Version>\s*([^<]*?)\s*</Version>', 'IgnoreCase')
            if (-not $match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
              throw "Cannot read <Version> from $source"
            }
            return $match.Groups[1].Value.Trim()
          }

          $version = Get-ProjectVersion (Get-Content 'src/Directory.Build.props' -Raw) 'src/Directory.Build.props'
          $versionPattern = '^((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$'
          if ($version -cnotmatch $versionPattern) {
            throw "Project version must be MAJOR.MINOR.PATCH (without a v prefix): $version"
          }

          $manifest = Get-Content 'src/MemPulse.PulseModule/module.json' -Raw | ConvertFrom-Json
          if ($manifest.version -ne $version) {
            throw "module.json version ($($manifest.version)) does not match Directory.Build.props ($version)."
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $before = $env:BEFORE_COMMIT
            if ([string]::IsNullOrEmpty($before) -or $before -match '^0{40}$') {
              throw 'Previous main commit was not provided; cannot verify a version change.'
            }
            $previousSpec = "$($before):src/Directory.Build.props"
            $previousText = @(git show $previousSpec) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Cannot read previous project from $before" }
            $oldVersion = Get-ProjectVersion $previousText "src/Directory.Build.props at $before"
            if ($oldVersion -eq $version) {
              Write-Host "Version unchanged ($version). No tag or release will be created."
              Add-Content -Path $env:GITHUB_OUTPUT -Value "publish=false"
              exit 0
            }
            if ($oldVersion -notmatch $versionPattern) {
              throw "Previous project version is invalid: $oldVersion"
            }
            if ([version]$version -le [version]$oldVersion) {
              throw "Version must increase: $oldVersion -> $version"
            }
          }

          $tag = "v$version"
          $alreadyTagged = @(git tag --list $tag)
          if ($alreadyTagged.Count -gt 0) {
            throw "Tag $tag already exists. Increase the project version to publish a new release."
          }
          foreach ($existing in @(git tag --list 'v*')) {
            if ($existing -cmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              if ([version]$existing.Substring(1) -ge [version]$version) {
                throw "New version $version must be higher than existing tag $existing."
              }
            }
          }

          "publish=true" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

  build-windows:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch PCPulse.Contracts NuGet package
        shell: pwsh
        run: ./scripts/fetch-contracts.ps1

      - name: Build and test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build MemPulse.sln --configuration Release --warnaserror -p:Version=${{ needs.check-version.outputs.version }}
          dotnet test MemPulse.sln --configuration Release --no-build

      - name: Publish standalone Windows x64 (App + Helper)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '${{ needs.check-version.outputs.version }}'
          dotnet publish src/MemPulse/MemPulse.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=$ver -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
          dotnet publish src/MemPulse.Helper/MemPulse.Helper.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=$ver -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --output publish

      - name: Test packaged EXE startup
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/MemPulse.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--startup-smoke-test' -Wait -PassThru
          $logDir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'MemPulse\Logs'
          if ($process.ExitCode -ne 0) { throw "Packaged MemPulse startup failed: $($process.ExitCode)" }
          $latest = Get-ChildItem $logDir -Filter 'startup-*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest -or -not (Select-String -Path $latest.FullName -Pattern 'Startup smoke test passed' -Quiet)) {
            throw "Packaged startup succeeded but no startup success marker was recorded."
          }

      - name: Build per-user installer and portable zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path 'publish\MemPulse.exe', 'publish\MemPulse.Helper.exe' -DestinationPath 'dist\MemPulse-win-x64.zip' -Force
          ./scripts/build-installer.ps1
          ./scripts/package-module.ps1 -Rid win-x64 -OutputDir dist

      - uses: actions/upload-artifact@v7
        with:
          name: windows-release-assets
          path: |
            publish/MemPulse.exe
            dist/MemPulse-Setup-x64.exe
            dist/MemPulse-win-x64.zip
            dist/mempulse-module-*
          if-no-files-found: error

  build-linux:
    needs: check-version
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install Linux runtime dependencies and zip
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libx11-6 libice6 libsm6 libfontconfig1 xvfb zip

      - name: Fetch PCPulse.Contracts NuGet package
        run: bash ./scripts/fetch-contracts.sh

      - name: Build and test
        run: |
          dotnet build MemPulse.sln -c Release --warnaserror -p:Version=${{ needs.check-version.outputs.version }}
          dotnet test MemPulse.sln -c Release --no-build

      - name: Publish Linux x64 and arm64 (standalone + PCPulse modules)
        shell: bash
        run: |
          set -euo pipefail
          VER="${{ needs.check-version.outputs.version }}"
          mkdir -p dist
          for rid in linux-x64 linux-arm64; do
            rm -rf "publish/$rid"
            dotnet publish src/MemPulse/MemPulse.csproj -c Release -r "$rid" --self-contained true -p:Version="$VER" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "publish/$rid"
            dotnet publish src/MemPulse.Helper/MemPulse.Helper.csproj -c Release -r "$rid" --self-contained true -p:Version="$VER" -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false -o "publish/$rid"
            cp scripts/install-linux.sh "publish/$rid/install.sh"
            chmod +x "publish/$rid/MemPulse" "publish/$rid/MemPulse.Helper" "publish/$rid/install.sh"
            tar -czf "dist/MemPulse-$rid.tar.gz" -C "publish/$rid" .
            bash ./scripts/package-module.sh "$rid" dist
          done
          xvfb-run -a ./publish/linux-x64/MemPulse --startup-smoke-test

      - uses: actions/upload-artifact@v7
        with:
          name: linux-release-assets
          path: |
            dist/MemPulse-linux-*.tar.gz
            dist/mempulse-module-*.zip
            dist/mempulse-module-*.zip.sha256
          if-no-files-found: error

  publish-release:
    needs: [check-version, build-windows, build-linux]
    if: needs.check-version.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: release-bundle
          merge-multiple: true

      - name: Generate combined SHA256SUMS.txt
        shell: bash
        run: |
          set -euo pipefail
          cd release-bundle
          rm -f SHA256SUMS.txt
          ls -1
          sha256sum MemPulse.exe MemPulse-Setup-x64.exe MemPulse-win-x64.zip MemPulse-linux-x64.tar.gz MemPulse-linux-arm64.tar.gz mempulse-module-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Preserve verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: mempulse-${{ needs.check-version.outputs.version }}-release-candidate
          path: release-bundle/*
          if-no-files-found: error
          retention-days: 14

      - name: Create version tag and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.MEMPULSE_RELEASE_TOKEN || github.token }}
          TAG: ${{ needs.check-version.outputs.tag }}
          APP_VERSION: ${{ needs.check-version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            release-bundle/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "MemPulse $APP_VERSION" \
            --generate-notes \
            --latest
