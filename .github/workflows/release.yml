name: Release MemPulse

# Release automatically when the version in the project file is raised on main.
on:
  push:
    branches: [main]
    paths:
      - 'src/MemPulse/MemPulse.csproj'
  workflow_dispatch:

permissions:
  contents: write

# Only one release can be published at a time, even if main receives rapid pushes.
concurrency:
  group: mempulse-publish
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect version bump
        id: version
        shell: pwsh
        env:
          BEFORE_COMMIT: ${{ github.event.before }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content 'src/MemPulse/MemPulse.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          $versionPattern = '^((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*))$'
          if ($version -cnotmatch $versionPattern) {
            throw "Project version must be MAJOR.MINOR.PATCH (without a v prefix): $version"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'push') {
            $before = $env:BEFORE_COMMIT
            if ([string]::IsNullOrEmpty($before) -or $before -match '^0{40}$') {
              throw 'Previous main commit was not provided; cannot verify a version change.'
            }
            $previousSpec = "$($before):src/MemPulse/MemPulse.csproj"
            $previousText = @(git show $previousSpec) -join "`n"
            if ($LASTEXITCODE -ne 0) { throw "Cannot read previous project from $before" }
            [xml]$previousProject = $previousText
            $oldVersion = [string]$previousProject.Project.PropertyGroup.Version
            if ($oldVersion -eq $version) {
              Write-Host "Version unchanged ($version). No tag or release will be created."
              "publish=false" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($oldVersion -notmatch $versionPattern) {
              throw "Previous project version is invalid: $oldVersion"
            }
            if ([version]$version -le [version]$oldVersion) {
              throw "Version must increase: $oldVersion -> $version"
            }
          }

          $tag = "v$version"
          # Never recreate or overwrite a version that was already tagged.
          $alreadyTagged = @(git tag --list $tag)
          if ($alreadyTagged.Count -gt 0) {
            throw "Tag $tag already exists. Increase the project version to publish a new release."
          }
          foreach ($existing in @(git tag --list 'v*')) {
            if ($existing -cmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
              if ([version]$existing.Substring(1) -ge [version]$version) {
                throw "New version $version must be higher than existing tag $existing."
              }
            }
          }

          Write-Host "New version: $version -> $tag (commit $env:GITHUB_SHA)"
          "TAG=$tag" >> $env:GITHUB_ENV
          "APP_VERSION=$version" >> $env:GITHUB_ENV
          "publish=true" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.publish == 'true'
        with:
          dotnet-version: '8.0.x'

      - name: Build
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: dotnet build src/MemPulse/MemPulse.csproj --configuration Release --warnaserror -p:Version=$env:APP_VERSION

      - name: Smoke tests
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: dotnet run --project tests/MemPulse.SmokeTests/MemPulse.SmokeTests.csproj --configuration Release

      - name: Test brand icon and RAM percentage rendering
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: dotnet run --project tests/MemPulse.IconTests/MemPulse.IconTests.csproj --configuration Release

      - name: Publish self-contained executable
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          dotnet publish src/MemPulse/MemPulse.csproj --configuration Release --runtime win-x64 --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish

      - name: Test packaged EXE startup (WPF/XAML/icons)
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/MemPulse.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--startup-smoke-test' -Wait -PassThru
          $logDir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'MemPulse\Logs'
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter 'startup-*.log' | ForEach-Object {
              Write-Host "==== Startup diagnostic: $($_.Name) ===="
              Get-Content $_.FullName -Tail 200
            }
          }
          if ($process.ExitCode -ne 0) { throw "Packaged MemPulse startup failed: $($process.ExitCode)" }
          $latest = Get-ChildItem $logDir -Filter 'startup-*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest -or -not (Select-String -Path $latest.FullName -Pattern 'Проверка создания главного окна пройдена' -Quiet)) {
            throw "Packaged startup succeeded but no startup success marker was recorded."
          }
          Write-Host "PASS: Packaged MemPulse starts, initializes WPF and writes startup diagnostics."
      - name: Build per-user installer
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Version $env:APP_VERSION

      - name: Publish Linux x64 and arm64
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          foreach ($rid in @('linux-x64', 'linux-arm64')) {
            dotnet publish src/MemPulse.Linux/MemPulse.Linux.csproj --configuration Release --runtime $rid --self-contained true -p:Version=$env:APP_VERSION -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output "publish-$rid"
            if ($LASTEXITCODE -ne 0) { throw "Linux publish failed: $rid" }
            tar -czf "dist/MemPulse-$rid.tar.gz" -C "publish-$rid" .
            if ($LASTEXITCODE -ne 0) { throw "Linux archive failed: $rid" }
          }

      - name: Generate SHA-256 checksums
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        run: |
          $paths = @('publish/MemPulse.exe', 'dist/MemPulse-Setup-x64.exe', 'dist/MemPulse-linux-x64.tar.gz', 'dist/MemPulse-linux-arm64.tar.gz')
          $lines = foreach ($path in $paths) {
            $hash = (Get-FileHash $path -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($path))"
          }
          $lines | Set-Content -Path dist/SHA256SUMS.txt -Encoding ascii

      - name: Create version tag and publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 'gh release create' creates the Git tag automatically if it does not exist.
          # It then publishes the same commit and attaches verified build artifacts.
          gh release create $env:TAG `
            "dist/MemPulse-Setup-x64.exe" `
            "dist/MemPulse-linux-x64.tar.gz" `
            "dist/MemPulse-linux-arm64.tar.gz" `
            "publish/MemPulse.exe" `
            "dist/SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "MemPulse $env:APP_VERSION" `
            --generate-notes `
            --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }

      - name: Remove superseded MemPulse releases and version tags
        if: steps.version.outputs.publish == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:TAG
          if ($tag -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'Invalid current release version; refusing cleanup.'
          }
          $current = [version]$tag.Substring(1)
          $published = gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName,isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or $published.tagName -cne $tag) {
            throw 'New release is not published; refusing cleanup.'
          }
          foreach ($asset in @('MemPulse.exe', 'MemPulse-Setup-x64.exe', 'MemPulse-linux-x64.tar.gz', 'MemPulse-linux-arm64.tar.gz', 'SHA256SUMS.txt')) {
            if ($asset -cnotin @($published.assets | ForEach-Object { $_.name })) {
              throw "Missing release asset $asset; refusing cleanup."
            }
          }
          $releases = gh release list --repo $env:GITHUB_REPOSITORY --limit 1000 --json tagName,isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot list releases.' }
          foreach ($old in $releases) {
            if ($old.isDraft -or $old.tagName -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { continue }
            if ([version]$old.tagName.Substring(1) -ge $current) { continue }
            Write-Host "Deleting older release and tag $($old.tagName)"
            gh release delete $old.tagName --cleanup-tag --yes --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Failed to delete $($old.tagName)" }
          }
          # Also remove version tags whose releases were removed separately in the past.
          $remoteRefs = @(git ls-remote --tags --refs origin)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read remote tag list.' }
          foreach ($ref in $remoteRefs) {
            if ($ref -notmatch 'refs/tags/(v[^\s]+)$') { continue }
            $candidate = $Matches[1]
            if ($candidate -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { continue }
            if ([version]$candidate.Substring(1) -ge $current) { continue }
            Write-Host "Removing orphaned version tag $candidate"
            git push origin --delete "refs/tags/$candidate"
            if ($LASTEXITCODE -ne 0) { throw "Failed to remove old version tag $candidate" }
          }
