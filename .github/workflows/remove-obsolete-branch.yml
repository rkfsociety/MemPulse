name: Remove obsolete MemPulse branch (one-time)
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/remove-obsolete-branch.yml

permissions:
  contents: write

jobs:
  remove-obsolete-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged design branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X DELETE "repos/$GH_REPO/git/refs/heads/design/refine-dark-dashboard"
