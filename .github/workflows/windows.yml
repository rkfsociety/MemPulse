name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Fetch PCPulse.Contracts NuGet package
        shell: pwsh
        run: ./scripts/fetch-contracts.ps1

      - name: Build solution
        run: dotnet build MemPulse.sln --configuration Release --warnaserror

      - name: Run unit and security tests
        run: dotnet test MemPulse.sln --configuration Release --no-build

      - name: Publish standalone Windows x64 (App + Helper)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish src/MemPulse/MemPulse.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true --output publish
          dotnet publish src/MemPulse.Helper/MemPulse.Helper.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishTrimmed=false --output publish

      - name: Package PCPulse module (win-x64)
        shell: pwsh
        run: ./scripts/package-module.ps1 -Rid win-x64 -OutputDir release-artifacts

      - name: Test packaged EXE startup (Avalonia/UI/logs)
        shell: pwsh
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'publish/MemPulse.exe').Path
          $process = Start-Process -FilePath $exe -ArgumentList '--startup-smoke-test' -Wait -PassThru
          $logDir = Join-Path ([Environment]::GetFolderPath('LocalApplicationData')) 'MemPulse\Logs'
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -Filter 'startup-*.log' | ForEach-Object {
              Write-Host "==== Startup diagnostic: $($_.Name) ===="
              Get-Content $_.FullName -Tail 200
            }
          }
          if ($process.ExitCode -ne 0) { throw "Packaged MemPulse startup failed: $($process.ExitCode)" }
          $latest = Get-ChildItem $logDir -Filter 'startup-*.log' | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $latest -or -not (Select-String -Path $latest.FullName -Pattern 'Startup smoke test passed' -Quiet)) {
            throw "Packaged startup succeeded but no startup success marker was recorded."
          }
          Write-Host "PASS: Packaged MemPulse starts, initializes Avalonia UI and writes startup diagnostics."

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MemPulse-win-x64
          path: |
            publish/
            release-artifacts/mempulse-module-*
